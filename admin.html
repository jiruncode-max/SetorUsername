<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikRob — Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--bg:#07070d;--bg2:#0d0d16;--card:#131324;--accent:#00e5a0;--adim:rgba(0,229,160,.1);--aglow:rgba(0,229,160,.3);--cyan:#00d4ff;--warn:#ffa502;--danger:#ff4060;--text:#e2e2f0;--muted:#6a6a82;--border:#1f1f36}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        .atmos{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(800px 600px at 85% 15%,rgba(255,165,2,.04),transparent 70%),radial-gradient(600px 600px at 15% 85%,rgba(0,229,160,.03),transparent 70%);animation:atm 18s ease-in-out infinite alternate}
        @keyframes atm{0%{transform:translate(0,0)}100%{transform:translate(15px,-20px)}}
        .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.018;background-image:linear-gradient(var(--warn) 1px,transparent 1px),linear-gradient(90deg,var(--warn) 1px,transparent 1px);background-size:70px 70px}
        .orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px);opacity:.1}
        .o1{width:280px;height:280px;background:var(--warn);top:-50px;right:-30px;animation:oa 22s ease-in-out infinite alternate}
        .o2{width:220px;height:220px;background:var(--accent);bottom:-30px;left:-40px;animation:ob 19s ease-in-out infinite alternate}
        @keyframes oa{0%{transform:translate(0,0)}100%{transform:translate(-25px,20px)}}
        @keyframes ob{0%{transform:translate(0,0)}100%{transform:translate(20px,-28px)}}
        .inp{width:100%;padding:14px 18px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;transition:all .3s;outline:none}
        .inp:focus{border-color:var(--warn);box-shadow:0 0 0 4px rgba(255,165,2,.1),0 0 20px rgba(255,165,2,.1)}
        .inp::placeholder{color:var(--muted);font-family:'Space Grotesk',sans-serif}
        .btn{padding:14px 24px;border:none;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:all .3s}
        .btn-w{background:linear-gradient(135deg,var(--warn),#e69500);color:var(--bg)}
        .btn-w:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,165,2,.25)}
        .btn-w:active{transform:translateY(0)}
        .btn-w:disabled{opacity:.4;cursor:not-allowed;transform:none}
        .btn-gh{padding:8px 16px;background:transparent;color:var(--muted);border:1.5px solid var(--border);border-radius:10px;font-weight:500;font-size:12px;cursor:pointer;transition:all .3s;font-family:'Space Grotesk',sans-serif}
        .btn-gh:hover{border-color:var(--warn);color:var(--warn);background:rgba(255,165,2,.06)}
        .bs{padding:6px 12px;background:transparent;border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif;font-weight:500}
        .bs-d{color:var(--danger);border:1px solid rgba(255,64,96,.18)}
        .bs-d:hover{background:rgba(255,64,96,.08);border-color:var(--danger)}
        .bs-g{color:var(--accent);border:1px solid rgba(0,229,160,.18)}
        .bs-g:hover{background:rgba(0,229,160,.08);border-color:var(--accent)}
        .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px}
        .toast-box{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
        .toast{padding:13px 18px;border-radius:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;max-width:340px;backdrop-filter:blur(10px);animation:ti .3s ease}
        .t-ok{background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.25);color:var(--accent)}
        .t-er{background:rgba(255,64,96,.1);border:1px solid rgba(255,64,96,.25);color:var(--danger)}
        .t-in{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);color:var(--cyan)}
        .t-wa{background:rgba(255,165,2,.1);border:1px solid rgba(255,165,2,.25);color:var(--warn)}
        @keyframes ti{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
        @keyframes to{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;animation:fi .2s ease}
        .modal-bx{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px;max-width:460px;width:92%;animation:bi .3s cubic-bezier(.4,0,.2,1)}
        @keyframes fi{from{opacity:0}to{opacity:1}}
        @keyframes bi{from{opacity:0;transform:scale(.93) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .page{display:none}.page.on{display:block;animation:pi .4s ease}
        @keyframes pi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
        .logo{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,var(--warn),#e69500);color:var(--bg);font-weight:700}
        .spin{width:18px;height:18px;border:2.5px solid transparent;border-top-color:currentColor;border-radius:50%;animation:sp .6s linear infinite;display:inline-block}
        @keyframes sp{to{transform:rotate(360deg)}}
        .pulse{width:7px;height:7px;background:var(--warn);border-radius:50%;animation:pd 2s ease-in-out infinite}
        @keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.4)}}
        .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:14px;font-size:10px;font-weight:600}
        .b-new{background:rgba(0,229,160,.1);color:var(--accent);border:1px solid rgba(0,229,160,.2)}
        .b-read{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
        .sn{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;line-height:1}
        .sl{font-size:11px;color:var(--muted);margin-top:2px}
        .ic{display:flex;align-items:center;justify-content:center;border-radius:50%}
        .tab{padding:8px 16px;background:transparent;border:none;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
        .tab.on{color:var(--warn);border-bottom-color:var(--warn)}
        .tab:hover:not(.on){color:var(--text)}
        .row{display:grid;grid-template-columns:1fr 1fr 80px 130px 90px;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);transition:background .15s}
        .row:hover{background:rgba(255,255,255,.015)}
        .row-h{color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;background:var(--bg2)}
        .det{display:none;padding:0 16px 12px;border-bottom:1px solid var(--border)}
        .det.open{display:block;animation:pi .25s ease}
        .uc{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:all .2s}
        .uc:hover{border-color:#2a2a44;background:rgba(255,255,255,.01)}
        @media(max-width:768px){.row{grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px}.row-h{display:none}.row .c-s,.row .c-t,.row .c-a{display:none}}
    </style>
</head>
<body>
<div class="atmos"></div><div class="grid-bg"></div><div class="orb o1"></div><div class="orb o2"></div>
<div class="toast-box" id="TB"></div>
<div id="ML"></div>

<div style="position:relative;z-index:2;min-height:100vh;">

    <!-- NAV -->
    <nav style="position:sticky;top:0;z-index:50;background:rgba(7,7,13,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);">
        <div style="max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="logo" style="width:32px;height:32px;font-size:14px;"><i class="fas fa-link"></i></div>
                <span style="font-weight:700;font-size:16px;">TikRob</span>
                <span style="font-size:10px;color:var(--warn);background:rgba(255,165,2,.08);padding:2px 8px;border-radius:5px;border:1px solid rgba(255,165,2,.2);font-weight:600;">ADMIN</span>
            </div>
            <div id="navA" style="display:none;align-items:center;gap:8px;">
                <div class="pulse"></div>
                <span style="font-size:10px;color:var(--muted);">Live</span>
                <button class="btn-gh" onclick="loadData()" style="font-size:10px;padding:4px 10px;"><i class="fas fa-rotate"></i></button>
                <button class="btn-gh" onclick="doLogout()" style="font-size:10px;padding:4px 10px;"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </div>
    </nav>

    <!-- NO CONFIG -->
    <div class="page" id="pgNo">
        <div style="min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:24px;">
            <div class="card" style="max-width:400px;text-align:center;">
                <div class="ic" style="width:60px;height:60px;margin:0 auto 14px;background:rgba(255,165,2,.08);border:1.5px solid rgba(255,165,2,.15);">
                    <i class="fas fa-exclamation-triangle" style="font-size:24px;color:var(--warn);"></i>
                </div>
                <h2 style="font-size:18px;font-weight:700;margin-bottom:6px;">Belum Ada Password</h2>
                <p style="color:var(--muted);font-size:12px;margin-bottom:18px;">Set password admin dulu di halaman Member.</p>
                <a href="index.html" class="btn btn-w" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;width:auto;padding:12px 22px;">
                    <i class="fas fa-arrow-left" style="margin-right:6px;"></i> Ke Member
                </a>
            </div>
        </div>
    </div>

    <!-- LOGIN -->
    <div class="page" id="pgL">
        <div style="min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:24px;">
            <div class="card" style="max-width:400px;width:100%;display:flex;flex-direction:column;gap:18px;">
                <div style="text-align:center;">
                    <div class="ic" style="width:68px;height:68px;margin:0 auto 12px;background:rgba(255,165,2,.08);border:1.5px solid rgba(255,165,2,.15);">
                        <i class="fas fa-shield-halved" style="font-size:28px;color:var(--warn);"></i>
                    </div>
                    <h2 style="font-size:22px;font-weight:700;">Admin Login</h2>
                    <p style="color:var(--muted);font-size:12px;margin-top:3px;">Masukkan password admin</p>
                </div>
                <input type="password" class="inp" id="inPw" placeholder="Password">
                <button class="btn btn-w" style="width:100%;" onclick="doLogin()"><i class="fas fa-unlock" style="margin-right:6px;"></i> Masuk</button>
                <div style="text-align:center;">
                    <a href="index.html" style="color:var(--muted);font-size:12px;text-decoration:none;"><i class="fas fa-arrow-left" style="margin-right:3px;"></i> Kembali ke Member</a>
                </div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="page" id="pgD">
        <div style="max-width:1100px;margin:0 auto;padding:24px;">
            <div style="display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--border);">
                <button class="tab on" id="tMsg" onclick="swTab('msg')"><i class="fas fa-envelope" style="margin-right:5px;"></i> Semua Pesan</button>
                <button class="tab" id="tUsr" onclick="swTab('usr')"><i class="fab fa-tiktok" style="margin-right:5px;"></i> Username TikTok</button>
            </div>

            <!-- TAB: PESAN -->
            <div id="secMsg">
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;">
                    <div class="card" style="padding:16px;"><div class="sn" style="color:var(--warn);" id="sT">0</div><div class="sl">Total Pesan</div></div>
                    <div class="card" style="padding:16px;"><div class="sn" style="color:var(--accent);" id="sN">0</div><div class="sl">Pesan Baru</div></div>
                    <div class="card" style="padding:16px;"><div class="sn" style="color:var(--cyan);" id="sU">0</div><div class="sl">User TikTok</div></div>
                    <div class="card" style="padding:16px;"><div class="sn" style="color:var(--danger);" id="sR">0</div><div class="sl">Username Roblox</div></div>
                </div>
                <div class="card" style="padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <div style="flex:1;min-width:160px;">
                        <input type="text" class="inp" id="inS" placeholder="Cari TikTok / Roblox..." oninput="render()" style="padding:9px 12px;font-size:12px;">
                    </div>
                    <div style="display:flex;gap:3px;">
                        <button class="tab on" data-f="all" onclick="setF(this,'all')">Semua</button>
                        <button class="tab" data-f="new" onclick="setF(this,'new')">Baru</button>
                        <button class="tab" data-f="read" onclick="setF(this,'read')">Dibaca</button>
                    </div>
                </div>
                <div class="card" style="padding:0;overflow:hidden;">
                    <div class="row row-h"><div>TikTok</div><div>Roblox</div><div class="c-s">Status</div><div class="c-t">Waktu</div><div class="c-a">Aksi</div></div>
                    <div id="mB" style="max-height:480px;overflow-y:auto;">
                        <div style="padding:36px;text-align:center;color:var(--muted);"><i class="fas fa-inbox" style="font-size:26px;display:block;margin-bottom:8px;opacity:.25;"></i>Belum ada pesan</div>
                    </div>
                </div>
                <div style="margin-top:12px;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;">
                    <button class="btn-gh" onclick="markAllRead()"><i class="fas fa-check-double" style="margin-right:3px;"></i> Tandai Dibaca</button>
                    <button class="bs bs-d" onclick="clearAll()"><i class="fas fa-trash" style="margin-right:3px;"></i> Hapus Semua</button>
                </div>
            </div>

            <!-- TAB: USER TIKTOK -->
            <div id="secUsr" style="display:none;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
                    <h3 style="font-size:17px;font-weight:700;"><i class="fab fa-tiktok" style="margin-right:7px;color:var(--accent);"></i> Daftar Username TikTok</h3>
                    <input type="text" class="inp" id="inUS" placeholder="Cari username..." oninput="renderUsr()" style="width:220px;padding:9px 12px;font-size:12px;">
                </div>
                <div id="uL" style="display:flex;flex-direction:column;gap:8px;">
                    <div style="padding:36px;text-align:center;color:var(--muted);"><i class="fab fa-tiktok" style="font-size:26px;display:block;margin-bottom:8px;opacity:.25;"></i>Belum ada user</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/* ===== DATABASE: NPOINT.IO ===== */
const NP_ID = 'a93e08ea530468333497';
const NP_URL = 'https://api.npoint.io/' + NP_ID;
const PW_KEY = 'tikrob_admin_pw';
let all = [];
let filt = 'all';
let curTab = 'msg';

async function npGet() { const r = await fetch(NP_URL); if (!r.ok) throw new Error('Gagal baca: ' + r.status); return r.json(); }
async function npPut(data) { const r = await fetch(NP_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) throw new Error('Gagal simpan: ' + r.status); return r.json(); }
function getPw() { return localStorage.getItem(PW_KEY) || ''; }

/* ===== TOAST ===== */
function toast(msg, t = 'ok') {
    const c = document.getElementById('TB'), el = document.createElement('div');
    const ic = { ok: 'fa-check-circle', er: 'fa-exclamation-circle', in: 'fa-info-circle', wa: 'fa-exclamation-triangle' };
    const cls = { ok: 't-ok', er: 't-er', in: 't-in', wa: 't-wa' };
    el.className = 'toast ' + (cls[t] || 't-ok');
    el.innerHTML = '<i class="fas ' + (ic[t] || ic.ok) + '"></i><span>' + msg + '</span>';
    c.appendChild(el);
    setTimeout(() => { el.style.animation = 'to .3s ease forwards'; setTimeout(() => el.remove(), 300); }, 3000);
}

/* ===== MODAL ===== */
function modal(h) { document.getElementById('ML').innerHTML = '<div class="modal-bg" onclick="if(event.target===this)cModal()"><div class="modal-bx">' + h + '</div></div>'; }
function cModal() { document.getElementById('ML').innerHTML = ''; }

/* ===== PAGE ===== */
function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('on')); document.getElementById(id).classList.add('on'); }

/* ===== UTILS ===== */
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtT(iso) {
    const d = new Date(iso), n = new Date(), df = n - d;
    if (df < 6e4) return 'Baru saja';
    if (df < 36e5) return Math.floor(df / 6e4) + ' mnt lalu';
    if (df < 864e5) return Math.floor(df / 36e5) + ' jam lalu';
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function anim(el, to) {
    const from = parseInt(el.textContent) || 0;
    if (from === to) { el.textContent = to; return; }
    const d = to - from, s = Math.min(Math.abs(d), 12), st = d / s;
    let i = 0;
    const iv = setInterval(() => { i++; if (i >= s) { el.textContent = to; clearInterval(iv); } else el.textContent = Math.round(from + st * i); }, 30);
}

/* ===== LOGIN ===== */
function doLogin() {
    if (document.getElementById('inPw').value === getPw()) {
        showPage('pgD');
        document.getElementById('navA').style.display = 'flex';
        loadData();
        toast('Login berhasil', 'wa');
    } else toast('Password salah', 'er');
}
function doLogout() {
    document.getElementById('inPw').value = '';
    document.getElementById('navA').style.display = 'none';
    showPage('pgL');
}

/* ===== TAB ===== */
function swTab(t) {
    curTab = t;
    document.getElementById('tMsg').classList.toggle('on', t === 'msg');
    document.getElementById('tUsr').classList.toggle('on', t === 'usr');
    document.getElementById('secMsg').style.display = t === 'msg' ? 'block' : 'none';
    document.getElementById('secUsr').style.display = t === 'usr' ? 'block' : 'none';
    if (t === 'usr') renderUsr();
}

/* ===== LOAD ===== */
async function loadData() {
    try { const d = await npGet(); all = d.messages || []; render(); stats(); if (curTab === 'usr') renderUsr(); }
    catch (e) { toast('Gagal memuat: ' + e.message, 'er'); }
}
function stats() {
    anim(document.getElementById('sT'), all.length);
    anim(document.getElementById('sN'), all.filter(m => m.status === 'new').length);
    anim(document.getElementById('sU'), new Set(all.map(m => m.tiktok)).size);
    anim(document.getElementById('sR'), new Set(all.map(m => m.roblox)).size);
}

/* ===== FILTER ===== */
function setF(b, f) { filt = f; document.querySelectorAll('[data-f]').forEach(x => x.classList.remove('on')); b.classList.add('on'); render(); }

/* ===== RENDER PESAN ===== */
function render() {
    const q = document.getElementById('inS').value.toLowerCase().trim();
    let list = [...all];
    if (filt === 'new') list = list.filter(m => m.status === 'new');
    if (filt === 'read') list = list.filter(m => m.status === 'read');
    if (q) list = list.filter(m => m.tiktok.toLowerCase().includes(q) || m.roblox.toLowerCase().includes(q) || m.message.toLowerCase().includes(q));
    list.sort((a, b) => new Date(b.time) - new Date(a.time));

    const box = document.getElementById('mB');
    if (!list.length) {
        box.innerHTML = '<div style="padding:36px;text-align:center;color:var(--muted);"><i class="fas fa-inbox" style="font-size:26px;display:block;margin-bottom:8px;opacity:.25;"></i>' + (q ? 'Tidak ditemukan' : 'Belum ada pesan') + '</div>';
        return;
    }

    box.innerHTML = list.map(m => `
        <div class="row" onclick="togDet('${m.id}')" style="cursor:pointer;" title="Klik untuk detail">
            <div><div style="display:flex;align-items:center;gap:5px;"><i class="fab fa-tiktok" style="color:var(--accent);font-size:11px;"></i><span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;">${esc(m.tiktok)}</span></div></div>
            <div><div style="display:flex;align-items:center;gap:5px;"><i class="fas fa-gamepad" style="color:var(--cyan);font-size:11px;"></i><span style="font-family:'JetBrains Mono',monospace;font-size:12px;">${esc(m.roblox)}</span></div></div>
            <div class="c-s"><span class="badge ${m.status==='new'?'b-new':'b-read'}">${m.status==='new'?'Baru':'Dibaca'}</span></div>
            <div class="c-t"><span style="font-size:10px;color:var(--muted);">${fmtT(m.time)}</span></div>
            <div class="c-a" onclick="event.stopPropagation();"><button class="bs bs-d" onclick="delMsg('${m.id}')" title="Hapus pesan"><i class="fas fa-trash"></i></button></div>
        </div>
        <div class="det" id="d-${m.id}">
            <div style="padding:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div><span style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;">TikTok</span><p style="font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:2px;color:var(--accent);">${esc(m.tiktok)}</p></div>
                <div><span style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;">Roblox</span><p style="font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:2px;color:var(--cyan);">${esc(m.roblox)}</p></div>
                <div style="grid-column:1/-1;"><span style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;">Pesan</span><p style="font-size:12px;margin-top:2px;line-height:1.5;">${m.message!=='-'?esc(m.message):'<span style="color:var(--muted);font-style:italic;">Tidak ada pesan</span>'}</p></div>
                <div><span style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;">Waktu</span><p style="font-size:11px;margin-top:2px;color:var(--muted);">${new Date(m.time).toLocaleString('id-ID')}</p></div>
                <div style="display:flex;gap:5px;align-items:flex-end;justify-content:flex-end;">
                    ${m.status==='new'?'<button class="bs bs-g" onclick="event.stopPropagation();mkRead(\''+m.id+'\')"><i class="fas fa-check" style="margin-right:3px;"></i>Dibaca</button>':''}
                    <button class="bs bs-d" onclick="event.stopPropagation();delMsg('${m.id}')"><i class="fas fa-trash" style="margin-right:3px;"></i>Hapus</button>
                </div>
            </div>
        </div>
    `).join('');
}

function togDet(id) { const el = document.getElementById('d-' + id); if (el) el.classList.toggle('open'); }

/* ===== RENDER USER TIKTOK ===== */
function renderUsr() {
    const q = (document.getElementById('inUS')?.value || '').toLowerCase().trim();
    const map = {};
    all.forEach(m => {
        if (!map[m.tiktok]) map[m.tiktok] = { tiktok: m.tiktok, cnt: 0, nw: 0, rb: [], lt: m.time };
        map[m.tiktok].cnt++;
        if (m.status === 'new') map[m.tiktok].nw++;
        if (!map[m.tiktok].rb.includes(m.roblox)) map[m.tiktok].rb.push(m.roblox);
        if (new Date(m.time) > new Date(map[m.tiktok].lt)) map[m.tiktok].lt = m.time;
    });
    let users = Object.values(map).sort((a, b) => new Date(b.lt) - new Date(a.lt));
    if (q) users = users.filter(u => u.tiktok.toLowerCase().includes(q));

    const box = document.getElementById('uL');
    if (!users.length) {
        box.innerHTML = '<div style="padding:36px;text-align:center;color:var(--muted);"><i class="fab fa-tiktok" style="font-size:26px;display:block;margin-bottom:8px;opacity:.25;"></i>' + (q ? 'Tidak ditemukan' : 'Belum ada user') + '</div>';
        return;
    }

    box.innerHTML = users.map(u => `
        <div class="uc">
            <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
                <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(0,229,160,.12),rgba(0,229,160,.03));display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fab fa-tiktok" style="color:var(--accent);font-size:15px;"></i>
                </div>
                <div style="min-width:0;">
                    <div style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(u.tiktok)}</div>
                    <div style="font-size:10px;color:var(--muted);margin-top:1px;">${u.cnt} pesan · ${u.nw > 0 ? '<span style="color:var(--accent);">' + u.nw + ' baru</span>' : 'semua dibaca'} · ${fmtT(u.lt)}</div>
                    <div style="font-size:10px;color:var(--cyan);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;" title="${esc(u.rb.join(', '))}"><i class="fas fa-gamepad" style="margin-right:3px;font-size:9px;"></i>${esc(u.rb.join(', '))}</div>
                </div>
            </div>
            <div style="display:flex;gap:5px;flex-shrink:0;">
                ${u.nw > 0 ? '<button class="bs bs-g" onclick="mkUsrRead(\'' + esc(u.tiktok) + '\')"><i class="fas fa-check" style="margin-right:3px;"></i>Dibaca</button>' : ''}
                <button class="bs bs-d" onclick="delUsr('${esc(u.tiktok)}')"><i class="fas fa-user-xmark" style="margin-right:3px;"></i>Hapus User</button>
            </div>
        </div>
    `).join('');
}

/* ===== ACTIONS ===== */

function delMsg(id) {
    modal(`
        <h3 style="font-size:16px;font-weight:700;margin-bottom:5px;"><i class="fas fa-trash" style="color:var(--danger);margin-right:6px;"></i>Hapus Pesan?</h3>
        <p style="color:var(--muted);font-size:12px;margin-bottom:18px;">Pesan ini akan dihapus permanen.</p>
        <div style="display:flex;gap:6px;justify-content:flex-end;">
            <button class="btn-gh" onclick="cModal()">Batal</button>
            <button class="bs bs-d" onclick="cfDelMsg('${id}')" style="padding:9px 16px;font-weight:600;">Hapus</button>
        </div>
    `);
}
async function cfDelMsg(id) {
    cModal();
    try {
        const d = await npGet();
        d.messages = (d.messages || []).filter(m => m.id !== id);
        await npPut(d);
        all = d.messages; render(); stats(); if (curTab === 'usr') renderUsr();
        toast('Pesan dihapus', 'in');
    } catch (e) { toast('Gagal: ' + e.message, 'er'); }
}

async function mkRead(id) {
    try {
        const d = await npGet();
        const m = (d.messages || []).find(x => x.id === id);
        if (m) m.status = 'read';
        await npPut(d);
        all = d.messages; render(); stats(); if (curTab === 'usr') renderUsr();
        toast('Ditandai dibaca', 'in');
    } catch (e) { toast('Gagal: ' + e.message, 'er'); }
}

async function markAllRead() {
    try {
        const d = await npGet(); let c = 0;
        (d.messages || []).forEach(m => { if (m.status === 'new') { m.status = 'read'; c++; } });
        if (!c) { toast('Tidak ada pesan baru', 'in'); return; }
        await npPut(d);
        all = d.messages; render(); stats(); if (curTab === 'usr') renderUsr();
        toast(c + ' pesan ditandai dibaca');
    } catch (e) { toast('Gagal: ' + e.message, 'er'); }
}

function delUsr(tt) {
    const cnt = all.filter(m => m.tiktok === tt).length;
    modal(`
        <h3 style="font-size:16px;font-weight:700;margin-bottom:5px;"><i class="fas fa-user-xmark" style="color:var(--danger);margin-right:6px;"></i>Hapus User TikTok?</h3>
        <p style="color:var(--muted);font-size:12px;margin-bottom:4px;">Hapus <strong style="color:var(--accent);">${esc(tt)}</strong> dan semua pesannya?</p>
        <p style="color:var(--danger);font-size:13px;font-weight:600;margin-bottom:18px;">${cnt} pesan akan dihapus!</p>
        <div style="display:flex;gap:6px;justify-content:flex-end;">
            <button class="btn-gh" onclick="cModal()">Batal</button>
            <button class="bs bs-d" onclick="cfDelUsr('${esc(tt)}')" style="padding:9px 16px;font-weight:600;"><i class="fas fa-user-xmark" style="margin-right:3px;"></i>Hapus User</button>
        </div>
    `);
}
async function cfDelUsr(tt) {
    cModal();
    try {
        const d = await npGet();
        const before = d.messages.length;
        d.messages = (d.messages || []).filter(m => m.tiktok !== tt);
        await npPut(d);
        all = d.messages; render(); stats(); renderUsr();
        toast((before - d.messages.length) + ' pesan dari ' + tt + ' dihapus', 'in');
    } catch (e) { toast('Gagal: ' + e.message, 'er'); }
}

async function mkUsrRead(tt) {
    try {
        const d = await npGet(); let c = 0;
        (d.messages || []).forEach(m => { if (m.tiktok === tt && m.status === 'new') { m.status = 'read'; c++; } });
        if (!c) { toast('Tidak ada pesan baru', 'in'); return; }
        await npPut(d);
        all = d.messages; render(); stats(); renderUsr();
        toast(c + ' pesan dari ' + tt + ' ditandai dibaca');
    } catch (e) { toast('Gagal: ' + e.message, 'er'); }
}

function clearAll() {
    modal(`
        <h3 style="font-size:16px;font-weight:700;margin-bottom:5px;"><i class="fas fa-exclamation-triangle" style="color:var(--danger);margin-right:6px;"></i>Hapus Semua?</h3>
        <p style="color:var(--muted);font-size:12px;margin-bottom:18px;">Semua pesan dihapus permanen.</p>
        <div style="display:flex;gap:6px;justify-content:flex-end;">
            <button class="btn-gh" onclick="cModal()">Batal</button>
            <button class="bs bs-d" onclick="cfClear()" style="padding:9px 16px;font-weight:600;">Hapus Semua</button>
        </div>
    `);
}
async function cfClear() {
    cModal();
    try {
        await npPut({ messages: [] });
        all = []; render(); stats(); if (curTab === 'usr') renderUsr();
        toast('Semua pesan dihapus', 'in');
    } catch (e) { toast('Gagal: ' + e.message, 'er'); }
}

/* ===== ENTER ===== */
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('pgL').classList.contains('on')) doLogin(); });

/* ===== AUTO REFRESH ===== */
setInterval(() => { if (document.getElementById('pgD').classList.contains('on')) loadData(); }, 8000);

/* ===== INIT ===== */
window.addEventListener('DOMContentLoaded', () => {
    if (getPw()) showPage('pgL');
    else showPage('pgNo');
});
</script>
</body>
</html>
