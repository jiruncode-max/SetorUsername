    <!-- ===== MODAL SEND ROBUX ===== -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <svg class="rbx-robux-svg"><use href="#icon-robux"/></svg>
                    Send Robux
                </div>
                <div class="modal-balance">
                    <svg class="rbx-robux-svg"><use href="#icon-robux"/></svg>
                    <span id="modal-balance">0</span>
                </div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div id="step-1">
                <div class="search-wrap">
                    <input type="text" id="username-input" class="input-box" placeholder="Search username..." oninput="handleInputSearch()" autocomplete="off">
                    <div id="suggestions-box" class="suggestions-box"></div>
                </div>
                <div id="search-status" class="search-status"></div>
                <button class="primary-btn" id="search-btn" disabled onclick="goToStep2()">Next</button>
            </div>

            <div id="step-2" style="display: none;">
                <div class="user-profile">
                    <div class="modal-avatar"><span id="avatar-fallback">?</span><img id="real-avatar" src="" alt="Avatar"></div>
                    <div class="display-name" id="display-name-text">Name</div>
                    <div class="username-tag" id="username-tag-text">@name</div>
                </div>

                <div class="amount-wrapper">
                    <svg class="rbx-robux-svg"><use href="#icon-robux"/></svg>
                    <input type="text" id="amount-input" class="amount-input" value="" placeholder="0" inputmode="numeric">
                </div>

                <div class="preset-grid">
                    <button class="preset-btn" data-val="25" onclick="setAmount(25)">25</button>
                    <button class="preset-btn" data-val="50" onclick="setAmount(50)">50</button>
                    <button class="preset-btn" data-val="100" onclick="setAmount(100)">100</button>
                    <button class="preset-btn" data-val="200" onclick="setAmount(200)">200</button>
                </div>

                <button class="primary-btn" id="send-btn" disabled onclick="sendRobux()">Send Robux</button>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 15px; line-height: 1.4; font-weight: 600;">
                    Pilih opsi 25 / 50 / 100 / 200 atau ketik manual.<br>Robux are sent instantly with no fees.
                </div>
            </div>

            <div id="step-loading" style="display: none;">
                <div class="spinner"></div>
                <div id="loading-text" style="font-weight: 700; margin-top: 10px;">Sending...</div>
            </div>

            <div id="step-3" style="display: none;">
                <div style="width: 60px; height: 60px; background: #00b06f; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; margin: 0 auto 15px;">✓</div>
                <h3 style="margin: 0 0 10px 0;">Success!</h3>
                <p style="margin: 0; color: var(--text-secondary); font-size: 14px; font-weight: 600;" id="success-text">Sent 500 Robux</p>
                <button class="primary-btn" style="background-color: rgba(255,255,255,0.1); color: var(--text-primary);" onclick="closeModal()">Done</button>
            </div>

            <div style="text-align: left;">
                <label class="settings-label">NAMA AKUN</label>
                <input type="text" id="settings-name" class="input-box" placeholder="Nama akun" maxlength="20">

                <label class="settings-label">FOTO AVATAR</label>
                <div class="avatar-upload-row">
                    <div class="modal-avatar">
                        <span id="settings-avatar-initial">J</span>
                        <img id="settings-avatar-preview" src="" alt="">
                    </div>
                    <div>
                        <button type="button" class="upload-btn" onclick="document.getElementById('avatar-file').click()">📁 Pilih dari Galeri</button>
                        <br>
                        <button type="button" class="reset-link" onclick="resetAvatar()">↺ Kembalikan foto default</button>
                    </div>
                    <input type="file" id="avatar-file" accept="image/*" style="display:none;" onchange="previewAvatar(event)">
                </div>

                <label class="settings-label">SALDO ROBUX</label>
                <input type="text" id="settings-balance" class="input-box" placeholder="50,000">

                <button class="primary-btn" onclick="saveSettings()">Simpan</button>
            </div>
        </div>
